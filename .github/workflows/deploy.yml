name: Build and Deploy to OpenShift

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      OC_SERVER: https://api.rm1.0a51.p1.openshiftapps.com:6443
      OC_NAMESPACE: anderson-gianotti-dev
      REGISTRY: default-route-openshift-image-registry.apps.rm1.0a51.p1.openshiftapps.com
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Configure GitHub Packages credentials
        env:
          MAVEN_PACKAGES_TOKEN: ${{ secrets.MAVEN_PACKAGES_TOKEN }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${MAVEN_PACKAGES_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Build and test with Maven
        run: mvn -B verify

      - name: Trivy vulnerability report
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: 'fs'
          version: 'v0.76.1'
          scan-ref: '.'
          scanners: 'vuln,secret,misconfig'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
          format: 'table'
          exit-code: '0'

      - name: Trivy security gate (CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: 'fs'
          version: 'v0.76.1'
          scan-ref: '.'
          scanners: 'vuln,secret,misconfig'
          severity: 'CRITICAL,HIGH'
          format: 'table'
          exit-code: '1'

      - name: Configure GitHub Packages credentials for Docker build
        env:
          MAVEN_PACKAGES_TOKEN: ${{ secrets.MAVEN_PACKAGES_TOKEN }}
        run: |
          mkdir -p .m2
          cat > .m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${MAVEN_PACKAGES_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Log in to OpenShift registry
        env:
          OC_TOKEN: ${{ secrets.OC_TOKEN }}
        run: |
          echo "$OC_TOKEN" | docker login "$REGISTRY" \
            -u "user" --password-stdin

      - name: Build and push image
        run: |
          IMAGE="$REGISTRY/$OC_NAMESPACE/api-busca-dados:latest"
          docker build --secret id=maven_settings,src=.m2/settings.xml -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Install oc CLI
        run: |
          curl -sL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/latest/openshift-client-linux.tar.gz \
            | tar xz oc
          sudo mv oc /usr/local/bin/

      - name: Deploy to OpenShift
        env:
          OC_TOKEN: ${{ secrets.OC_TOKEN }}
        run: |
          oc login --token="$OC_TOKEN" --server="$OC_SERVER"
          oc project "$OC_NAMESPACE"
          oc apply -f openshift/app.yaml
          oc rollout status deployment/api-busca-dados --timeout=10m

      - name: Show route
        run: oc get route api-busca-dados
